name: Render cardnews to GitHub Pages (docs/)

on:
  push:
    branches: [main]
    paths:
      - "output/cardnews/**/cards.json"
      - "scripts/render_cardnews.py"
      - "scripts/publish_to_pages.py"
      - "assets/templates/**"
      - "assets/fonts/**"
      - "config/config.example.json"
  workflow_dispatch:
    inputs:
      date:
        description: "Render specific YYYY-MM-DD (optional; blank = latest)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Detect changed dates
        id: dates
        shell: bash
        run: |
          set -euo pipefail

          # Manual run: use provided date, or default to latest output/cardnews/YYYY-MM-DD folder.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.date }}" ]]; then
              echo "dates=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
              echo "Detected dates (manual): ${{ inputs.date }}"
              exit 0
            fi

            LATEST="$(ls -1 output/cardnews 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -n 1 || true)"
            if [[ -n "${LATEST}" ]]; then
              echo "dates=${LATEST}" >> "$GITHUB_OUTPUT"
              echo "Detected dates (manual default latest): ${LATEST}"
              exit 0
            fi

            echo "dates=" >> "$GITHUB_OUTPUT"
            echo "No dated folders found under output/cardnews." >&2
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ -z "${BEFORE}" || "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || true)"
          fi
          if [[ -z "${BEFORE}" ]]; then
            echo "dates=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract YYYY-MM-DD from paths like: output/cardnews/YYYY-MM-DD/cards.json
          DATES="$(git diff --name-only "${BEFORE}" "${AFTER}" -- 'output/cardnews/**/cards.json' \
            | awk -F/ '/^output\/cardnews\/[0-9]{4}-[0-9]{2}-[0-9]{2}\/cards\.json$/ { print $3 }' \
            | sort -u | tr '\n' ' ')"

          echo "dates=${DATES}" >> "$GITHUB_OUTPUT"
          echo "Detected dates: ${DATES}"

      - name: Render + publish
        if: steps.dates.outputs.dates != ''
        shell: bash
        run: |
          set -euo pipefail
          for day in ${{ steps.dates.outputs.dates }}; do
            echo "=== ${day} ==="
            python scripts/render_cardnews.py --config config/config.example.json --date "${day}" --cards-json "output/cardnews/${day}/cards.json"
            python scripts/publish_to_pages.py --config config/config.example.json --date "${day}"
          done

      - name: Commit docs changes
        if: steps.dates.outputs.dates != ''
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -qE '^( M|A | D)'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Render cardnews images into docs/ [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
